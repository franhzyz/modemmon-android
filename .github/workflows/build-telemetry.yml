name: Build modem-telemetry package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download OpenWrt SDK
        run: |
          curl -sL -o sdk.tar.zst \
            https://downloads.openwrt.org/releases/25.12.5/targets/sunxi/cortexa53/openwrt-sdk-25.12.5-sunxi-cortexa53_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar -I zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y zstd file

      - name: Copy package into SDK
        run: |
          cp -r openwrt/modem-telemetry sdk/package/

      - name: Build package
        working-directory: sdk
        run: |
          make defconfig
          make package/modem-telemetry/compile V=s -j$(nproc)

      - name: Collect apk
        run: |
          mkdir -p out
          find sdk/bin/packages -name 'modem-telemetry*.apk' -exec cp {} out/ \;
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modem-telemetry-apk
          path: out/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.1.0-alpha out/*.apk --clobber --repo franhzyz/modemmon-android
